services:
  # 1. Backend Web Service
  - type: web
    name: mern-blog-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: "*"
      - key: MONGODB_URI
        sync: false # Set this in Render Dashboard to your MongoDB Atlas URI

  # 2. Frontend Static Site
  - type: web
    name: mern-blog-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set this to your backend service URL on Render (e.g. https://mern-blog-backend.onrender.com/api)
