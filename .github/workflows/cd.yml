name: Continuous Delivery & Deployment (CD)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1. Build and Push Docker Images to Docker Hub
  build-and-push:
    name: Build & Push Images to Docker Hub
    runs-on: ubuntu-latest
    needs: [] # In a full pipeline, you can set `needs: [backend-ci, frontend-ci]`
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & Push Backend Docker Image
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-backend:${{ github.sha }}

      # Build & Push Frontend Docker Image
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.CLOUD_RUN_BACKEND_URL }}/api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-frontend:${{ github.sha }}

  # 2. Deploy Services to Google Cloud Run
  deploy-to-cloud-run:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Deploy Backend Service to Cloud Run
      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy mern-blog-backend \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-backend:latest \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars MONGODB_URI="${{ secrets.MONGODB_ATLAS_URI }}",PORT="5000",CLIENT_ORIGIN="*" \
            --port 5000

      # Deploy Frontend Service to Cloud Run
      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy mern-blog-frontend \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-frontend:latest \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 80
