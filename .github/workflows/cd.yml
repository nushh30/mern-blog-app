name: Continuous Delivery & Deployment (CD)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-and-push:
    name: Build & Push Images to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Docker Hub Credentials
        id: check_auth
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "auth_configured=false" >> $GITHUB_OUTPUT
            echo "Notice: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are not yet added in GitHub repository settings."
            echo "Skipping Docker Hub image push until secrets are configured."
          else
            echo "auth_configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check_auth.outputs.auth_configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check_auth.outputs.auth_configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        if: steps.check_auth.outputs.auth_configured == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-backend:${{ github.sha }}

      - name: Build & Push Frontend Image
        if: steps.check_auth.outputs.auth_configured == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.CLOUD_RUN_BACKEND_URL }}/api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-blog-frontend:${{ github.sha }}
