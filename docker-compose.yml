services:
  # 1. MongoDB Database Service
  mongo:
    image: mongo:6.0
    container_name: mern_blog_db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mern_blog
    volumes:
      - mongo_data:/data/db
    networks:
      - mern_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Express Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mern_blog_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/mern_blog
      - CLIENT_ORIGIN=*
      - NODE_ENV=production
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - mern_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 3. React Frontend Service (Served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: mern_blog_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mern_network

volumes:
  mongo_data:
    driver: local

networks:
  mern_network:
    driver: bridge
